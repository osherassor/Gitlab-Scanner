[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gitlab-scanner"
version = "0.1.0"
description = "GitLab reconnaissance and secret scanning tool"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Osher", email = "osher@example.com" }]
dependencies = [
  "requests>=2.31.0",
  "urllib3>=2.2.0",
  "PyYAML>=6.0.1",
  "python-dateutil>=2.9.0.post0",
  "tqdm>=4.66.0",
  "charset-normalizer>=3.3.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.5.0"]

[project.scripts]
gitlab-scanner = "gitlab_scanner.cli:main"

[tool.setuptools.packages.find]
include = ["gitlab_scanner*"]


