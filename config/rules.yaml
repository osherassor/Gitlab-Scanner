rules:
  - id: aws.access_key
    pattern: "AKIA[0-9A-Z]{16}"
    keywords: ["aws", "access", "secret", "key"]
    severity: high
  - id: aws.secret_key
    pattern: '(?i)aws_secret_access_key\s*[:=]\s*([A-Za-z0-9/+=]{40})'
    keywords: ["aws", "secret", "key"]
    severity: high
  - id: gcp.api_key
    pattern: 'AIza[0-9A-Za-z\-_]{35}'
    keywords: ["gcp", "google", "apikey", "key"]
    severity: high
  - id: slack.token
    pattern: "xox[baprs]-[0-9A-Za-z-]{10,48}"
    keywords: ["slack", "token"]
    severity: medium
  - id: slack.webhook
    pattern: 'https://hooks\.slack\.com/services/[A-Za-z0-9\-\/]+'
    keywords: ["slack", "webhook"]
    severity: high
  - id: stripe.secret
    pattern: "sk_(live|test)_[0-9A-Za-z]{24}"
    keywords: ["stripe", "secret", "key", "token"]
    severity: high
  - id: stripe.publishable
    pattern: "pk_(live|test)_[0-9A-Za-z]{24}"
    keywords: ["stripe", "pk"]
    severity: low
  - id: twilio.sid
    pattern: "AC[a-f0-9]{32}"
    keywords: ["twilio", "sid", "account"]
    severity: medium
  - id: twilio.auth_token
    pattern: '(?i)twilio.*auth[_-]?token\s*[:=]\s*[A-Za-z0-9]{32}'
    keywords: ["twilio", "token"]
    severity: medium
  - id: ssh.private_key
    pattern: "-----BEGIN (?:RSA|EC|OPENSSH|DSA)? PRIVATE KEY-----"
    keywords: ["ssh", "rsa", "private", "key"]
    severity: critical
  - id: pgp.private_key
    pattern: "-----BEGIN PGP PRIVATE KEY BLOCK-----"
    keywords: ["pgp", "private", "key"]
    severity: critical
  - id: gitlab.pat
    pattern: 'glpat-[A-Za-z0-9_-]{20,}'
    keywords: ["gitlab", "token", "pat"]
    severity: high
  - id: github.token
    pattern: 'gh[pous]_[A-Za-z0-9]{36,}'
    keywords: ["github", "token"]
    severity: high
  - id: discord.webhook
    pattern: 'https://discord(?:app)?\.com/api/webhooks/[0-9]+/[A-Za-z0-9_-]+'
    keywords: ["discord", "webhook"]
    severity: high
  - id: jwt.token
    pattern: '[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'
    keywords: ["jwt", "bearer", "token"]
    severity: medium
  - id: generic.base64_long_string
    pattern: "\\b(?=(?:[A-Za-z0-9+/]{24,}={0,2})\\b)(?=[A-Za-z0-9+/]*[0-9])(?=[A-Za-z0-9+/]*[A-Z])(?=[A-Za-z0-9+/]*[a-z])[A-Za-z0-9+/]{24,}={0,2}\\b"
    keywords: ["base64", "encoded", "blob"]
    severity: low
  - id: generic.base64_with_context
    pattern: '(?i)\b(base64|b64|encod(e|ing)|decod(e|ing))\b[^\n]{0,80}\b[A-Za-z0-9+/]{16,}={0,2}\b'
    keywords: ["base64", "encode", "decode", "b64"]
    severity: medium
  - id: code.base64_calls
    pattern: '(?i)(base64\.(encode|decode)|b64encode|b64decode|\batob\(|\bbtoa\(|Buffer\.from\([^\)]*,\s*["'']base64["'']\)|Convert::ToBase64String|openssl\s+enc\s+-base64)'
    keywords: ["base64", "encode", "decode", "openssl", "Buffer.from", "atob", "btoa"]
    severity: low
  - id: code.crypto.node
    pattern: "(?i)crypto\\.(createCipheriv|createDecipheriv|createCipher|createDecipher)\\("
    keywords: ["crypto", "cipher", "decipher"]
    severity: medium
  - id: code.crypto.java
    pattern: '(?i)Cipher\.getInstance\("[A-Z0-9\/\-]+"\)'
    keywords: ["cipher", "java", "getInstance"]
    severity: medium
  - id: code.crypto.python
    pattern: '(?i)(cryptography|Fernet|Crypto(?:\.Cipher)?|AES\.new|DES\.new|ChaCha20|ChaCha20Poly1305|PBKDF2|scrypt|bcrypt|argon2)'
    keywords: ["crypto", "encrypt", "decrypt", "aes", "fernet", "pbkdf2", "scrypt", "bcrypt", "argon2"]
    severity: medium
  - id: code.crypto.openssl
    pattern: '(?i)openssl\s+enc\s+-[a-z0-9-]+'
    keywords: ["openssl", "enc"]
    severity: low
  - id: code.crypto.dotnet
    pattern: '(?i)(AesManaged|RijndaelManaged|ProtectedData|Aes\.Create\()'
    keywords: ["aes", "rijndael", "protecteddata", ".net"]
    severity: medium
  - id: generic.password
    pattern: "(?i)password\\s*[:=]\\s*[^\\s\"']{6,}"
    keywords: ["password", "pwd", "pass"]
    severity: medium
  - id: generic.token
    pattern: '(?i)(api[-_ ]?key|token|secret)\s*[:=]\s*[A-Za-z0-9-_]{8,}'
    keywords: ["token", "secret", "apikey", "key"]
    severity: medium
  - id: db.url
    pattern: '(?i)(postgres|mysql|mongodb|redis|amqp)://[^\s]+'
    keywords: ["postgres", "mysql", "mongodb", "redis", "amqp", "url"]
    severity: medium
  - id: azure.storage_key
    pattern: 'DefaultEndpointsProtocol=https;AccountName=[A-Za-z0-9-]+;AccountKey=[A-Za-z0-9+/=]{43,}=='
    keywords: ["azure", "storage", "accountkey"]
    severity: high
  - id: internal.url
    pattern: 'https?://(?:10|127|172\.(?:1[6-9]|2\d|3[01])|192\.168)\.[^\s]+'
    keywords: ["internal", "url", "service"]
    severity: low
  - id: url.basic_auth
    pattern: 'https?://[^\s:/]+:[^\s@]+@[^\s]+'
    keywords: ["http", "https", "basic", "auth"]
    severity: high
  - id: openai.api_key
    pattern: 'sk-[A-Za-z0-9]{32,}'
    keywords: ["openai", "api", "key", "sk"]
    severity: high
  - id: telegram.bot_token
    pattern: '[0-9]{8,10}:[A-Za-z0-9_-]{35}'
    keywords: ["telegram", "bot", "token"]
    severity: medium
  - id: sendgrid.api_key
    pattern: 'SG\.[A-Za-z0-9_-]{66}'
    keywords: ["sendgrid", "api", "key"]
    severity: high
  - id: mailgun.api_key
    pattern: 'key-[A-Za-z0-9]{32}'
    keywords: ["mailgun", "api", "key"]
    severity: high
  - id: pagerduty.integration_key
    pattern: '(?i)pagerduty.*(integration|routing).*key\s*[:=]\s*[A-Z0-9]{32}'
    keywords: ["pagerduty", "key"]
    severity: medium
  - id: datadog.api_key
    pattern: '(?i)datadog.*api[_-]?key\s*[:=]\s*[0-9a-f]{32}'
    keywords: ["datadog", "api", "key"]
    severity: medium
  - id: sentry.dsn
    pattern: 'https://[A-Za-z0-9]{32}@sentry\.io/\d+'
    keywords: ["sentry", "dsn"]
    severity: medium
  - id: newrelic.license_key
    pattern: '(?i)newrelic.*(license|api).*key\s*[:=]\s*[A-Za-z0-9]{32,}'
    keywords: ["newrelic", "license", "key"]
    severity: medium
  - id: cloudflare.api_token
    pattern: '(?i)cloudflare.*(api[_-]?token|api[_-]?key)\s*[:=]\s*[A-Za-z0-9-_]{40,}'
    keywords: ["cloudflare", "api", "token"]
    severity: high
  - id: digitalocean.pat
    pattern: 'dop_v1_[a-f0-9]{64}'
    keywords: ["digitalocean", "token"]
    severity: high
  - id: heroku.api_key
    pattern: '(?i)heroku.*api[_-]?key\s*[:=]\s*[0-9a-f]{32}'
    keywords: ["heroku", "api", "key"]
    severity: high
  - id: square.access_token
    pattern: 'sq0atp-[A-Za-z0-9\-_]+'
    keywords: ["square", "access", "token"]
    severity: high
  - id: square.client_secret
    pattern: 'sq0csp-[A-Za-z0-9\-_]+'
    keywords: ["square", "client", "secret"]
    severity: high
  - id: huggingface.token
    pattern: 'hf_[A-Za-z0-9]{32,}'
    keywords: ["huggingface", "token"]
    severity: medium
  - id: notion.secret
    pattern: 'secret_[A-Za-z0-9]{43,}'
    keywords: ["notion", "secret", "token"]
    severity: medium
  - id: linear.api_key
    pattern: 'lin_[a-z0-9]{40}'
    keywords: ["linear", "api", "key"]
    severity: medium
  - id: okta.api_token
    pattern: '(?i)okta.*api[_-]?token\s*[:=]\s*[A-Za-z0-9_-]{20,}'
    keywords: ["okta", "api", "token"]
    severity: high
  - id: jira.api_token
    pattern: '(?i)(jira|atlassian).*api[_-]?token\s*[:=]\s*[A-Za-z0-9]{20,}'
    keywords: ["jira", "atlassian", "token"]
    severity: medium
  - id: jenkins.api_token
    pattern: '(?i)jenkins.*(api[_-]?token|crumb)\s*[:=]\s*[A-Za-z0-9]{16,}'
    keywords: ["jenkins", "token"]
    severity: medium
  - id: confluence.token
    pattern: '(?i)confluence.*api[_-]?token\s*[:=]\s*[A-Za-z0-9]{20,}'
    keywords: ["confluence", "token"]
    severity: medium
  - id: bitbucket.app_password
    pattern: '(?i)bitbucket.*(app[_-]?password|token)\s*[:=]\s*[A-Za-z0-9]{20,}'
    keywords: ["bitbucket", "password", "token"]
    severity: medium
  - id: artifactory.api_key
    pattern: '(?i)artifactory.*(api[_-]?key|access[_-]?token)\s*[:=]\s*[A-Za-z0-9._-]{20,}'
    keywords: ["artifactory", "token", "key"]
    severity: high
  - id: nexus.token
    pattern: '(?i)nexus.*(api[_-]?key|token)\s*[:=]\s*[A-Za-z0-9._-]{16,}'
    keywords: ["nexus", "token", "key"]
    severity: medium
  - id: grafana.token
    pattern: '(?i)grafana.*(api[_-]?key|token)\s*[:=]\s*[A-Za-z0-9_-]{20,}'
    keywords: ["grafana", "token"]
    severity: medium
  - id: prometheus.basic_auth
    pattern: "(?i)prometheus.*(basic[_-]?auth|password)\\s*[:=]\\s*[^\\s\"']{6,}"
    keywords: ["prometheus", "password", "auth"]
    severity: low
  - id: service.endpoints
    pattern: 'https?://[^\s]*(jenkins|jira|confluence|bitbucket|artifactory|nexus|sonarqube|grafana|prometheus)[^\s]*'
    keywords: ["endpoint", "service", "url"]
    severity: low
  - id: ipv4.private
    pattern: '\b(?:10|127|172\.(?:1[6-9]|2\d|3[01])|192\.168)\.(?:25[0-5]|2[0-4]\d|1?\d?\d)\.(?:25[0-5]|2[0-4]\d|1?\d?\d)\.(?:25[0-5]|2[0-4]\d|1?\d?\d)\b'
    keywords: ["ip", "private"]
    severity: low
  - id: ipv4.public
    pattern: '\\b(?:(?:[1-9]\\d?|1\\d\\d|2[01]\\d|22[0-3])\\.){3}(?:[1-9]\\d?|1\\d\\d|2[0-4]\\d|25[0-5])\\b'
    keywords: ["ip", "public"]
    severity: low
  - id: env.database_url
    pattern: '(?i)^\s*DATABASE_URL\s*[:=]\s*\S+'
    keywords: ["database_url", "env"]
    severity: high
  - id: env.jwt_secret
    pattern: '(?i)^\s*JWT_SECRET(_KEY)?\s*[:=]\s*\S+'
    keywords: ["jwt", "secret", "env"]
    severity: high
  - id: env.google_application_credentials
    pattern: '(?i)^\s*GOOGLE_APPLICATION_CREDENTIALS\s*[:=]\s*\S+'
    keywords: ["google", "credentials", "env"]
    severity: medium
  - id: env.gcp_api_key
    pattern: '(?i)^\s*GCP_API_KEY\s*[:=]\s*\S+'
    keywords: ["gcp", "api", "key", "env"]
    severity: high
  - id: env.firebase_api_key
    pattern: '(?i)^\s*FIREBASE_API_KEY\s*[:=]\s*\S+'
    keywords: ["firebase", "api", "key", "env"]
    severity: high
  - id: env.azure_storage_connection_string
    pattern: '(?i)^\s*AZURE_STORAGE_CONNECTION_STRING\s*[:=]\s*\S+'
    keywords: ["azure", "storage", "connection", "env"]
    severity: high
  - id: env.azure_client_secret
    pattern: '(?i)^\s*AZURE_CLIENT_SECRET\s*[:=]\s*\S+'
    keywords: ["azure", "client", "secret", "env"]
    severity: high
  - id: env.slack_bot_token
    pattern: '(?i)^\s*SLACK_BOT_TOKEN\s*[:=]\s*\S+'
    keywords: ["slack", "bot", "token", "env"]
    severity: high
  - id: env.discord_token
    pattern: '(?i)^\s*DISCORD_(WEBHOOK|TOKEN)\s*[:=]\s*\S+'
    keywords: ["discord", "token", "env"]
    severity: high
  - id: env.stripe_secret
    pattern: '(?i)^\s*STRIPE_(SECRET|SK)_?KEY\s*[:=]\s*\S+'
    keywords: ["stripe", "secret", "key", "env"]
    severity: high
  - id: env.twilio_auth_token
    pattern: '(?i)^\s*TWILIO_AUTH_TOKEN\s*[:=]\s*\S+'
    keywords: ["twilio", "auth", "token", "env"]
    severity: medium
  - id: env.github_token
    pattern: '(?i)^\s*GH[A-Z_]*_TOKEN\s*[:=]\s*\S+'
    keywords: ["github", "token", "env"]
    severity: high
  - id: env.gitlab_token
    pattern: '(?i)^\s*GITLAB(_PAT|_TOKEN)?\s*[:=]\s*\S+'
    keywords: ["gitlab", "token", "env"]
    severity: high
  - id: env.aws_session_token
    pattern: '(?i)^\s*AWS_SESSION_TOKEN\s*[:=]\s*\S+'
    keywords: ["aws", "session", "token", "env"]
    severity: medium
  - id: env.mongo_uri
    pattern: '(?i)^\s*(MONGODB_URI|MONGO_URI)\s*[:=]\s*\S+'
    keywords: ["mongo", "uri", "env"]
    severity: medium
  - id: env.redis_url
    pattern: '(?i)^\s*REDIS_URL\s*[:=]\s*\S+'
    keywords: ["redis", "url", "env"]
    severity: medium
  - id: env.smtp_password
    pattern: '(?i)^\s*(SMTP_PASSWORD|SMTP_PASS|MAIL_PASSWORD)\s*[:=]\s*\S+'
    keywords: ["smtp", "password", "env"]
    severity: medium
  - id: aws.temp_access_key
    pattern: 'ASIA[0-9A-Z]{16}'
    keywords: ["aws", "sts", "temporary", "access", "key"]
    severity: high
  - id: npm.auth_token
    pattern: '(?i)^\s*//registry\.npmjs\.org/:_authToken\s*=\s*\S+'
    keywords: ["npm", "authToken"]
    severity: high
  - id: pypi.token
    pattern: 'pypi-[-A-Za-z0-9_]{20,}'
    keywords: ["pypi", "token"]
    severity: high
  - id: docker.auth
    pattern: '"auth"\s*:\s*"[A-Za-z0-9+/=]{8,}"'
    keywords: ["docker", "config", "auth"]
    severity: medium
  - id: google.oauth_client_secret
    pattern: '"client_secret"\s*:\s*"[^"]+"'
    keywords: ["google", "oauth", "client_secret"]
    severity: high
  - id: oauth.access_token_json
    pattern: '"access_token"\s*:\s*"[^"]+"'
    keywords: ["oauth", "access_token"]
    severity: medium
  - id: k8s.kubeconfig_token
    pattern: '(?i)\btoken:\s*[A-Za-z0-9\._\-]{20,}'
    keywords: ["kubeconfig", "token", "k8s"]
    severity: medium
  - id: azure.sas_token
    pattern: '(?i)[\?&]sv=[^&]+&ss=[^&]+&srt=[^&]+&sp=[^&]+&se=[^&]+&st=[^&]+&spr=[^&]+&sig=[^&]+'
    keywords: ["azure", "sas", "sig"]
    severity: high
  - id: vault.token
    pattern: '(?i)^(\s*(VAULT_TOKEN|VAULT_ROOT_TOKEN)\s*[:=]\s*\S+|hvs\.[A-Za-z0-9]{24,})'
    keywords: ["vault", "token"]
    severity: high
  - id: terraform.cloud_token
    pattern: '(?i)^\s*TFE_TOKEN\s*[:=]\s*\S+'
    keywords: ["terraform", "tfe", "token"]
    severity: high
  - id: databricks.pat
    pattern: 'dapi[a-z0-9]{32}'
    keywords: ["databricks", "token"]
    severity: high
  - id: sendinblue.api_key
    pattern: 'xkeysib-[A-Za-z0-9]{64}-[A-Za-z0-9]{16}'
    keywords: ["sendinblue", "api", "key"]
    severity: high
  - id: algolia.admin_key
    pattern: '(?i)^\s*ALGOLIA_ADMIN_API_KEY\s*[:=]\s*\S+'
    keywords: ["algolia", "admin", "api", "key"]
    severity: high
  - id: salesforce.credentials
    pattern: '(?i)\b(SF_USERNAME|SF_PASSWORD|SF_SECURITY_TOKEN)\s*[:=]\s*\S+'
    keywords: ["salesforce", "sf", "username", "password", "token"]
    severity: medium
  - id: sentry.auth_token
    pattern: '(?i)^\s*SENTRY_AUTH_TOKEN\s*[:=]\s*\S+'
    keywords: ["sentry", "auth", "token"]
    severity: high
  - id: sonar.token
    pattern: '(?i)^\s*(SONAR_TOKEN|SONARQUBE_TOKEN)\s*[:=]\s*\S+'
    keywords: ["sonar", "token"]
    severity: high
  - id: gitlab.ci_token
    pattern: '(?i)^\s*(CI_JOB_TOKEN|CI_REGISTRY_PASSWORD|RUNNER_TOKEN)\s*[:=]\s*\S+'
    keywords: ["gitlab", "ci", "token", "runner"]
    severity: high
  - id: kubernetes.service_account
    pattern: '(?i)\bserviceAccount(Name)?\s*[:=]\s*\S+'
    keywords: ["k8s", "serviceaccount"]
    severity: low
  - id: aws.cli_credentials
    pattern: '(?i)^\s*(aws_access_key_id|aws_secret_access_key|aws_session_token)\s*=\s*\S+'
    keywords: ["aws", "credentials", "cli"]
    severity: high
  - id: jira.basic_auth
    pattern: '(?i)https?://[^\s:/]+:[^\s@]+@[^\s]+/rest/api/2'
    keywords: ["jira", "basic", "auth"]
    severity: high
  - id: grafana.admin_password
    pattern: '(?i)^\s*(GF_SECURITY_ADMIN_PASSWORD|GF_SECURITY_ADMIN_USER)\s*[:=]\s*\S+'
    keywords: ["grafana", "admin", "password"]
    severity: medium
  - id: minio.credentials
    pattern: '(?i)^\s*(MINIO_ROOT_USER|MINIO_ROOT_PASSWORD)\s*[:=]\s*\S+'
    keywords: ["minio", "root", "password"]
    severity: high
  - id: rabbitmq.user_pass
    pattern: '(?i)^\s*(RABBITMQ_DEFAULT_USER|RABBITMQ_DEFAULT_PASS)\s*[:=]\s*\S+'
    keywords: ["rabbitmq", "user", "pass"]
    severity: medium
  - id: postgresql.conn_string
    pattern: '(?i)postgresql://[^:\s]+:[^@\s]+@[^/\s]+/\S+'
    keywords: ["postgresql", "conn", "string"]
    severity: high
  - id: mysql.conn_string
    pattern: '(?i)mysql://[^:\s]+:[^@\s]+@[^/\s]+/\S+'
    keywords: ["mysql", "conn", "string"]
    severity: high
  - id: elastic.api_key
    pattern: '(?i)^\s*(ELASTIC_API_KEY|ELASTICSEARCH_API_KEY)\s*[:=]\s*\S+'
    keywords: ["elastic", "api", "key"]
    severity: high
  - id: consul.acl_token
    pattern: '(?i)^\s*(CONSUL_HTTP_TOKEN|CONSUL_ACL_TOKEN)\s*[:=]\s*\S+'
    keywords: ["consul", "acl", "token"]
    severity: high
  - id: vault.addr_token
    pattern: '(?i)^\s*(VAULT_ADDR|VAULT_TOKEN)\s*[:=]\s*\S+'
    keywords: ["vault", "addr", "token"]
    severity: high
  - id: suspicious.runas_command
    pattern: '(?i)(^|\n|\s)runas(?:\.exe)?\b.*(/user:|/savecred)'
    keywords: ["runas", "user", "savecred"]
    severity: medium
  - id: suspicious.impersonation_api
    pattern: '(?i)(impersonate|logonuser|CreateProcessWithLogonW|as_user|become_user)'
    keywords: ["impersonate", "logonuser", "as_user", "become_user"]
    severity: medium
  - id: suspicious.get_credentials_calls
    pattern: '(?i)(getcreds|get_?cred(ent(ial)?)?|get-credential|Get-Credential|PSCredential|ConvertTo-SecureString)'
    keywords: ["getcreds", "credential", "pscredential"]
    severity: medium
  - id: cmd.cmdkey_usage
    pattern: '(?i)\bcmdkey(?:\.exe)?\b.*(/add:|/user:|/pass:|/generic:)'
    keywords: ["cmdkey", "user", "pass"]
    severity: medium
  - id: batch.set_user
    pattern: '(?i)^\s*set(?:x)?\s+(USER(NAME)?|LOGIN|ACCOUNT)\s*=\s*\S+'
    keywords: ["set", "user", "username", "login"]
    severity: low
  - id: batch.set_password
    pattern: '(?i)^\s*set(?:x)?\s+(PASS(?:WD|WORD)?|PWD)\s*=\s*\S+'
    keywords: ["set", "pass", "pwd", "password"]
    severity: high
  - id: shell.export_user
    pattern: '(?i)^\s*export\s+(USER(NAME)?|LOGIN|ACCOUNT)\s*=\s*\S+'
    keywords: ["export", "user", "username", "login"]
    severity: low
  - id: shell.export_password
    pattern: '(?i)^\s*export\s+(PASS(?:WD|WORD)?|PWD|PASSWORD)\s*=\s*\S+'
    keywords: ["export", "pass", "pwd", "password"]
    severity: high
  - id: generic.pass_kw_assignment
    pattern: "(?i)\\b(PASS(?:WD|WORD)?|PWD)\\s*[:=]\\s*[^\\s\"']{4,}"
    keywords: ["pass", "pwd", "password"]
    severity: medium
  - id: generic.cfg_secret_assignment
    pattern: "(?i)\\b(cfg|config|configuration|settings)\\b[^\n]{0,80}\\b(password|pass|pwd|secret|token|key)\\b\\s*[:=]\\s*\\S+"
    keywords: ["cfg", "config", "configuration", "settings", "secret", "token", "key", "password", "pass", "pwd"]
    severity: high
  - id: generic.jwt_config
    pattern: "(?i)\\b(jwt(_secret|_key)?|jwtPrivateKey|jwtPublicKey)\\b[^\n]{0,80}[:=]\\s*\\S+"
    keywords: ["jwt", "secret", "key"]
    severity: high
  - id: powershell.credential_usage
    pattern: '(?i)(Start-Process|Invoke-Command|New-Object)\b[^\n]{0,80}-Credential\s+\$?\w+'
    keywords: ["powershell", "-Credential", "Start-Process"]
    severity: medium
  - id: config.password_key
    pattern: '(?i)(spring\.datasource\.password|db_password|database_password|redis_password)\s*[:=]\s*\S+'
    keywords: ["password", "datasource", "db"]
    severity: medium
  - id: config.username_key
    pattern: '(?i)(spring\.datasource\.username|db_user(name)?|database_user(name)?)\s*[:=]\s*\S+'
    keywords: ["username", "datasource", "db"]
    severity: low
  - id: connection_string.user_pwd
